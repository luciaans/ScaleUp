name: Build and publish Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build APK and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name "$version" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk_path" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk_path" \
              --title "ScaleUp $GITHUB_REF_NAME" \
              --generate-notes
          fi
